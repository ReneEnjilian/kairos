models:
  - name: A
    relation: base
    port: 8001
    model_id: meta-llama/Llama-3.1-8B-Instruct

  - name: B
    relation: quantized
    port: 8002
    model_id: RedHatAI/Llama-3.2-3B-Instruct-quantized.w8a8

SLOs:
  accuracy: 0.9
  latency: 200.8

# rename knobs in monitoring
# move gpu_factor to models, more intuitive -> all the same or individual ?
knobs:
  sample_rate: 50
  sample_size: 100
  scheduler: holt
  monotonicity: true
  discard: 3
  recycle: 3
  gpu_factor: 1.3

